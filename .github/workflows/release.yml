name: Release

# Releases are cut by pushing a version tag:
#
#     git tag v5.3.0 && git push origin v5.3.0
#
# PyPI upload uses trusted publishing (OIDC), so no API token is stored anywhere.
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  guard:
    name: Check version and changelog
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'

      - name: Read the version from the tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Require the tag to point at a commit on master
        run: |
          git fetch --no-tags origin master
          git merge-base --is-ancestor HEAD FETCH_HEAD ||
            { echo "::error::$GITHUB_REF_NAME is not on master"; exit 1; }

      - name: Check pyproject.toml agrees with the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          declared=$(uv version --short --frozen)
          test "$declared" = "$VERSION" ||
            { echo "::error::pyproject.toml says $declared, tag says $VERSION"; exit 1; }

      - name: Check the package version and changelog agree with the tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv run --no-project python .github/scripts/release_guard.py "$VERSION" --notes notes.md

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: release-notes
          path: notes.md

  tests:
    name: Tests
    needs: guard
    permissions:
      contents: read
    uses: ./.github/workflows/tests.yml

  build:
    name: Build and verify artifacts
    needs: [guard, tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.guard.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: '3.13'

      - name: Build the sdist and wheel
        run: uv build

      - name: Check the artifacts carry the tagged version
        run: |
          test -f "dist/epubcheck-$VERSION.tar.gz"
          test -f "dist/epubcheck-$VERSION-py3-none-any.whl"

      - name: Check every bundled jar made it into the wheel
        run: |
          expected=$(find epubcheck -name '*.jar' | wc -l)
          packaged=$(unzip -Z1 "dist/epubcheck-$VERSION-py3-none-any.whl" | grep -c '\.jar$')
          echo "wheel contains $packaged of $expected jars"
          test "$packaged" -eq "$expected" ||
            { echo "::error::wheel is missing jars, EpubCheck would not run"; exit 1; }

      - name: Validate a sample EPUB with the built wheel
        run: |
          uv venv "$RUNNER_TEMP/smoke"
          VIRTUAL_ENV="$RUNNER_TEMP/smoke" uv pip install "dist/epubcheck-$VERSION-py3-none-any.whl"
          "$RUNNER_TEMP/smoke/bin/python" -c "import os, epubcheck; assert epubcheck.__version__ == os.environ['VERSION']"
          sample=$("$RUNNER_TEMP/smoke/bin/python" -c "from epubcheck import samples; print(samples.EPUB3_VALID)")
          "$RUNNER_TEMP/smoke/bin/epubcheck" "$sample"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: [guard, build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/epubcheck/${{ needs.guard.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@v1.14.2

  github-release:
    name: Create the GitHub release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: release-notes

      - name: Publish the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes-file notes.md
