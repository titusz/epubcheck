[project]
name = "epubcheck"
version = "5.3.0"
description = "Python epubcheck wrapper"
authors = [{ name = "Titusz Pan", email = "tp@py7.de" }]
requires-python = ">=3.10"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
keywords = [
    "EPUB",
    "validation",
    "epubcheck",
    "ebooks",
    "QA",
    "IDPF",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: Unix",
    "Operating System :: POSIX",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dependencies = [
    "tablib",
    "xlwt",
    "xlrd",
]

[project.urls]
Repository = "https://github.com/titusz/epubcheck/"

[project.scripts]
epubcheck = "epubcheck.cli:main"

[dependency-groups]
test = [
    "pytest",
    "coverage",
    "pytest-cov",
]
dev = [
    "poethepoet",
    "ruff",
    "mdformat-gfm",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.format]
line-ending = "lf"

# `patch` lets coverage measure `__main__.py`, which is only exercised via a subprocess.
[tool.coverage.run]
patch = ["subprocess"]

[tool.poe.tasks]
format-code = { cmd = "ruff format", help = "Code style formatting with ruff" }
format-markdown = { cmd = "mdformat --wrap 100 --end-of-line lf README.md", help = "Markdown formatting with mdformat" }
test = { cmd = "pytest --cov=epubcheck --cov-fail-under=100 --cov-report=term-missing", help = "Run tests with coverage" }
all = ["format-code", "format-markdown", "test"]
